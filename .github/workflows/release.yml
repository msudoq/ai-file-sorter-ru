name: Release Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published, created]

permissions:
  contents: write

jobs:
  build-release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Ensure llama.cpp submodule
        shell: pwsh
        run: |
          $llamaDir = "$env:GITHUB_WORKSPACE\app\include\external\llama.cpp"
          if (-not (Test-Path "$llamaDir\CMakeLists.txt")) {
            Write-Host "llama.cpp submodule missing or incomplete. Initializing..."
            git submodule update --init --recursive app/include/external/llama.cpp
          }
          if (-not (Test-Path "$llamaDir\CMakeLists.txt")) {
            Write-Host "Cloning llama.cpp fallback (tag b9850)..."
            Remove-Item -Recurse -Force $llamaDir -ErrorAction SilentlyContinue
            git clone --depth 1 --branch b9850 https://github.com/ggerganov/llama.cpp.git $llamaDir
          }
          Write-Host "llama.cpp is ready at $llamaDir"

      - name: Ensure Catch2 submodule
        shell: pwsh
        run: |
          $catch2Dir = "$env:GITHUB_WORKSPACE\external\Catch2"
          if (-not (Test-Path "$catch2Dir\CMakeLists.txt")) {
            git submodule update --init --recursive external/Catch2
          }

      - name: Enable long paths
        run: git config --system core.longpaths true

      - name: Cache vcpkg archives
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-archives-${{ runner.os }}-${{ hashFiles('app/vcpkg.json') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat"

      - name: Build llama runtime
        shell: pwsh
        run: |
          $vcpkgRoot = "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\app\scripts\build_llama_windows.ps1" `
            "cuda=off" `
            "vulkan=off" `
            "blas=off" `
            "vcpkgroot=$vcpkgRoot"

      - name: Build Windows app
        shell: pwsh
        run: |
          $vcpkgRoot = "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\app\build_windows.ps1" `
            -Configuration Release `
            -VcpkgRoot $vcpkgRoot `
            -Variants Standard `
            -Parallel 4

      - name: Package Windows Release Archive
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\app\build-windows" -Filter "aifilesorter.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
              throw "Could not find built aifilesorter.exe under app/build-windows"
          }
          $stageDir = $exe.DirectoryName
          Write-Host "Found stage directory: $stageDir"
          $zipPath = "$env:GITHUB_WORKSPACE\AIFileSorter-Windows-x64-ru.zip"
          Compress-Archive -Path "$stageDir\*" -DestinationPath $zipPath -Force
          Write-Host "Created archive: $zipPath"

      - name: Upload Build Artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: AIFileSorter-Windows-x64-ru
          path: AIFileSorter-Windows-x64-ru.zip

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.9.2-ru' }}
          name: AI File Sorter v1.9.2 (Русская версия)
          files: AIFileSorter-Windows-x64-ru.zip
          draft: false
          prerelease: false
          body: |
            ## AI File Sorter v1.9.2 с полной поддержкой русского языка 🇷🇺

            ### Что нового:
            - Полный русский перевод интерфейса программы (кнопки, меню, диалоги, настройки).
            - Русскоязычное руководство пользователя и быстрый старт (Quick Start).
            - Автоматическое определение русской локали при первом запуске в Windows.
            - Сохранена полная совместимость с оригинальной версией 1.9.2.

            ### Инструкция по установке:
            1. Скачайте архив **AIFileSorter-Windows-x64-ru.zip** ниже в блоке **Assets**.
            2. Распакуйте архив в любую удобную папку.
            3. Запустите файл `aifilesorter.exe`.
